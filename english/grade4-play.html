<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快乐英语乐园 · 小学四年级</title>
<style>
:root{
  --pink:#ff5fa2;--orange:#ff9f1c;--yellow:#ffd23f;--green:#2ec4b6;--blue:#3a86ff;--purple:#8338ec;
  --ink:#2b2d42;--soft:#fff8e7;--card:#ffffff;
  --radius:22px;
}
*{box-sizing:border-box}
html{font-size:20px}
body{
  margin:0;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(160deg,#fff3c4 0%,#ffe0ef 45%,#d9f2ff 100%) fixed;
  min-height:100vh;line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;touch-action:manipulation}
button:focus-visible,.tap:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.en{font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif;letter-spacing:.3px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.08)}
.cheer{margin:0;text-align:center;font-size:1.05rem;font-weight:700;padding:8px 12px;color:#fff;
  background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--green),var(--blue),var(--purple));background-size:300% 100%;animation:rainbow 12s linear infinite}
@keyframes rainbow{to{background-position:300% 0}}
.top{max-width:1100px;margin:0 auto;padding:8px 12px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:center}
h1{margin:0;font-size:1.5rem;white-space:nowrap}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tab{font-size:1.1rem;font-weight:800;padding:10px 18px;min-height:54px;border-radius:999px;background:#f1f3ff;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .15s}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.tab[aria-selected="true"]{color:#fff}
.tab[data-tab="words"][aria-selected="true"]{background:var(--pink)}
.tab[data-tab="sentences"][aria-selected="true"]{background:var(--orange)}
.tab[data-tab="dialogues"][aria-selected="true"]{background:var(--green)}
.tab[data-tab="passages"][aria-selected="true"]{background:var(--blue)}
.tab[data-tab="games"][aria-selected="true"]{background:var(--purple)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pill{font-size:.85rem;font-weight:700;padding:6px 12px;min-height:40px;border-radius:999px;background:#fff;border:2px solid #e3e6f5}
.pill.on{background:#fff4c2;border-color:var(--orange)}
.tip{max-width:1100px;margin:0 auto 8px;padding:10px 16px;border-radius:16px;background:#fff1f1;border:2px dashed #ff8b8b;font-size:.95rem;text-align:center}
.tip[hidden]{display:none}

main{max-width:1100px;margin:0 auto;padding:18px 12px 60px}
section[hidden]{display:none}
.intro{font-size:1rem;margin:4px 0 14px;text-align:center;color:#555}
.panel{background:rgba(255,255,255,.75);border-radius:28px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.06)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 14px}
.chip{font-size:1rem;font-weight:700;padding:8px 14px;min-height:50px;border-radius:999px;background:#fff;border:3px solid #eceefe;transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{border-color:var(--ink);background:var(--yellow)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:10px 0}
.big-btn{font-size:1.1rem;font-weight:800;padding:12px 22px;min-height:60px;border-radius:20px;color:#fff;background:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .12s}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.big-btn.pink{background:var(--pink)}.big-btn.orange{background:var(--orange)}.big-btn.green{background:var(--green)}.big-btn.purple{background:var(--purple)}.big-btn.gray{background:#8d99ae}
.big-btn.light{background:#fff;color:var(--ink);border:3px solid #e3e6f5}

/* ---------- words ---------- */
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.word{background:var(--card);border-radius:var(--radius);padding:12px 8px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.08);border:3px solid transparent;transition:transform .12s}
.word:hover{border-color:var(--yellow)}
.word .emo{font-size:2.4rem;line-height:1.2;display:block;min-height:2.9rem}
.word .emo.faded{opacity:.35}
.word .w{font-size:1.45rem;font-weight:800;display:block;word-break:break-word}
.word .zh{font-size:1rem;color:#666;display:block}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-2deg)}100%{transform:scale(1)}}

.flip{perspective:1200px;width:min(90vw,440px);height:300px;margin:6px auto 4px;cursor:pointer;background:none;padding:0;display:block}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 10px 0 rgba(0,0,0,.12);padding:16px}
.face.front{background:linear-gradient(135deg,#ff7eb3,#ff9f1c);color:#fff}
.face.back{background:linear-gradient(135deg,#3a86ff,#2ec4b6);color:#fff;transform:rotateY(180deg)}
.face .big-word{font-size:3.2rem;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.15);word-break:break-word;text-align:center;line-height:1.15}
.face .big-zh{font-size:2.6rem;font-weight:900}
.face .big-emo{font-size:4.2rem;line-height:1.1}
.face .hint{font-size:.95rem;opacity:.92;background:rgba(255,255,255,.22);padding:4px 14px;border-radius:999px}

/* ---------- sentences ---------- */
.list{display:grid;gap:12px}
.sent{background:var(--card);border-radius:var(--radius);padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;box-shadow:0 5px 0 rgba(0,0,0,.07);border:3px solid transparent;transition:border-color .2s,background .2s}
.sent .txt{flex:1 1 260px;cursor:pointer;min-width:0}
.sent .en{font-size:1.45rem;font-weight:800;display:block}
.zh-line{font-size:1.05rem;color:#666;display:block}
.sent .btns{display:flex;gap:8px}
.icon-btn{font-size:1.05rem;font-weight:800;min-width:60px;min-height:56px;padding:6px 12px;border-radius:18px;background:#fff4c2;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.icon-btn.follow-btn{background:#d7f8e8}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.speaking{border-color:var(--orange)!important;background:#fff6dc!important}
.your-turn{border-color:var(--green)!important;background:#e3fff5!important}
.follow{display:none;width:100%;font-size:1.1rem;font-weight:800;color:#13866f}
.follow.show{display:block}
.follow .bar{height:12px;border-radius:999px;background:#d8f3ec;overflow:hidden;margin-top:6px}
.follow .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--yellow));border-radius:999px}
.cat-title{font-size:1.15rem;font-weight:900;margin:14px 4px 0}
body.hide-zh .zh-line,body.hide-zh .zh-para{visibility:hidden}

/* ---------- dialogues ---------- */
.dlg-head{text-align:center;margin-bottom:8px}
.dlg-head .t{font-size:1.6rem;font-weight:900}
.cast{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.cast span{font-weight:800;padding:6px 14px;border-radius:999px;background:#fff}
.bubbles{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:10px auto}
.line{display:flex;gap:10px;align-items:flex-start;max-width:92%;cursor:pointer}
.line.B{align-self:flex-end;flex-direction:row-reverse}
.avatar{font-size:2.4rem;line-height:1;flex:none;text-align:center}
.avatar small{display:block;font-size:.7rem;font-weight:800;margin-top:2px}
.bubble{border-radius:24px;padding:10px 16px;box-shadow:0 5px 0 rgba(0,0,0,.07);border:3px solid transparent;background:#fff;transition:background .2s,border-color .2s}
.line.A .bubble{background:#fff0f6;border-top-left-radius:6px}
.line.B .bubble{background:#e8f4ff;border-top-right-radius:6px}
.bubble .en{font-size:1.35rem;font-weight:800;display:block}
.who{font-size:.8rem;font-weight:900;color:#888}

/* ---------- passages ---------- */
.passage{max-width:820px;margin:0 auto;background:#fff;border-radius:30px;padding:18px 22px;box-shadow:0 8px 0 rgba(0,0,0,.07)}
.passage .p-title{text-align:center;font-size:1.8rem;font-weight:900;margin:0}
.passage .p-zh{text-align:center;color:#777;margin:0 0 4px}
.passage .p-emo{text-align:center;font-size:3rem;margin:0}
.para{font-size:1.5rem;line-height:2.1;margin:10px 0}
.s{cursor:pointer;padding:2px 4px;border-radius:10px;transition:background .2s}
.s:hover{background:#fff4c2}
.s.speaking,.zs.speaking{background:#ffe08a!important}
.zh-para{font-size:1.1rem;line-height:1.9;color:#666;background:#f7f8ff;border-radius:18px;padding:10px 14px}
.zs{border-radius:8px;padding:1px 2px}
.p-follow{border:3px solid transparent;border-radius:18px;padding:4px 10px;min-height:10px}

/* ---------- games ---------- */
.game-switch{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.game-card{font-size:1.25rem;font-weight:900;padding:14px 22px;border-radius:24px;background:#fff;border:4px solid #eceefe;min-height:70px}
.game-card.on{border-color:var(--purple);background:#f1e6ff}
.speaker{font-size:4.5rem;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd23f);box-shadow:0 8px 0 rgba(0,0,0,.15);display:block;margin:6px auto 8px;animation:pulse 2.2s ease-in-out infinite}
.speaker:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:640px;margin:0 auto}
.opt{font-size:1.7rem;font-weight:900;min-height:96px;padding:10px;border-radius:24px;background:#fff;border:4px solid #e3e6f5;box-shadow:0 6px 0 rgba(0,0,0,.1);transition:transform .12s,background .2s,opacity .3s}
.opt .oe{display:block;font-size:1.8rem}
.opt.right{background:#c9f7d8;border-color:#27ae60;animation:pop .5s}
.opt.tried{opacity:.45}
.wiggle{animation:wiggle .45s}
@keyframes wiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.feedback{text-align:center;font-size:1.45rem;font-weight:900;min-height:2.4em;margin:12px 0 4px}
.feedback.good{color:#e67e22}
.feedback.soft{color:#3a86ff}

.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:700px;margin:0 auto}
.mcol{display:flex;flex-direction:column;gap:12px}
.tile{min-height:84px;border-radius:22px;background:#fff;border:4px solid #e3e6f5;box-shadow:0 6px 0 rgba(0,0,0,.1);font-weight:900;transition:transform .15s,background .2s,border-color .2s,opacity .3s;padding:6px}
.tile.pic{font-size:2.8rem;line-height:1}
.tile.pic.txt{font-size:2rem}
.tile.word-t{font-size:1.5rem}
.tile.sel{border-color:var(--orange);background:#fff1cc;transform:scale(1.05)}
.tile.matched{background:#c9f7d8;border-color:#27ae60;cursor:default;animation:matchpop .7s ease}
.tile.matched::after{content:" ✅";font-size:1rem}
@keyframes matchpop{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(4deg)}60%{transform:scale(.95) rotate(-3deg)}100%{transform:scale(1)}}
.celebrate{text-align:center;font-size:1.8rem;font-weight:900;color:var(--pink);margin:16px 0 4px;animation:pop .6s}

/* flying stars */
.fly{position:fixed;z-index:50;pointer-events:none;font-size:2rem;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(var(--r));opacity:0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);background:var(--ink);color:#fff;font-weight:800;padding:12px 22px;border-radius:999px;z-index:60;transition:transform .3s;max-width:92vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:#777;font-size:.85rem;padding:0 12px 30px}

@media (max-width:600px){
  html{font-size:18px}
  h1{font-size:1.3rem}
  .tab{padding:8px 12px;font-size:1rem}
  .word-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .face .big-word{font-size:2.6rem}
  .opt{font-size:1.4rem;min-height:84px}
  .tile.word-t{font-size:1.2rem}
  .tile.pic{font-size:2.4rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <p class="cheer">🌟 你敢开口说英语，就已经很棒啦！想点哪儿就点哪儿，玩着玩着就会啦～ 🌈</p>
  <div class="top">
    <h1>🎈 快乐英语乐园</h1>
    <nav role="tablist" aria-label="板块">
      <button class="tab" role="tab" data-tab="words">📚 单词</button>
      <button class="tab" role="tab" data-tab="sentences">💬 句子</button>
      <button class="tab" role="tab" data-tab="dialogues">👫 对话</button>
      <button class="tab" role="tab" data-tab="passages">📖 短文</button>
      <button class="tab" role="tab" data-tab="games">🎮 游戏</button>
    </nav>
    <div class="tools">
      <button class="pill" id="speedBtn" title="切换朗读速度">🙂 正常速度</button>
      <button class="pill" id="zhBtn" title="显示或隐藏中文">🀄 中文：显示</button>
      <button class="pill" id="stopBtn" title="停止朗读">⏹ 停止朗读</button>
    </div>
  </div>
  <div id="speechTip" class="tip" role="status" hidden></div>
</header>

<main>
  <!-- 单词 -->
  <section id="tab-words" role="tabpanel">
    <p class="intro">点一下单词就能听到读音 🔊　也可以切换到“翻转卡片”玩一玩</p>
    <div class="row">
      <button class="chip" id="modeList">📋 单词表</button>
      <button class="chip" id="modeCard">🃏 翻转卡片</button>
    </div>
    <div class="chips" id="wordThemes"></div>
    <div class="panel" id="wordArea"></div>
  </section>

  <!-- 句子 -->
  <section id="tab-sentences" role="tabpanel" hidden>
    <p class="intro">点句子听一听 🔊，点 🎤 跟读：先听一遍，再自己大声说一遍～</p>
    <div class="chips" id="sentCats"></div>
    <div class="row">
      <button class="big-btn green" id="sentAuto">▶️ 一句一句跟着读</button>
      <button class="big-btn gray" id="sentStop">⏹ 停一停</button>
    </div>
    <div class="list" id="sentList"></div>
  </section>

  <!-- 对话 -->
  <section id="tab-dialogues" role="tabpanel" hidden>
    <p class="intro">点一句读一句；也可以选一个角色，你来演，电脑演另一个 🎭</p>
    <div class="chips" id="dlgList"></div>
    <div class="panel" id="dlgArea"></div>
  </section>

  <!-- 短文 -->
  <section id="tab-passages" role="tabpanel" hidden>
    <p class="intro">可以听整篇，也可以点任何一句单独听 👂</p>
    <div class="chips" id="psgList"></div>
    <div id="psgArea"></div>
  </section>

  <!-- 游戏 -->
  <section id="tab-games" role="tabpanel" hidden>
    <p class="intro">随便玩，想玩多久就玩多久，选错了也没关系 😄</p>
    <div class="game-switch">
      <button class="game-card" id="gListen">👂 听音选词</button>
      <button class="game-card" id="gMatch">🧩 单词配对</button>
    </div>
    <div class="chips" id="gameThemes"></div>
    <div class="panel" id="gameArea"></div>
  </section>
</main>
<footer>所有声音都由浏览器自己朗读，不需要联网，也不需要登录。家长小提示：陪孩子一起读，比孩子自己读更有趣哦 💛</footer>
<div id="toast" role="status" aria-live="polite"></div>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function uniqueBy(list, keyFn) {
  const seen = new Set(), out = [];
  for (const x of list) { const k = keyFn(x); if (!seen.has(k)) { seen.add(k); out.push(x); } }
  return out;
}
let toastTimer = 0;
function toast(msg, ms = 2200) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}
function bump(el, cls = "pop") { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function burst(el, n = 10) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < n; i++) {
    const s = h("span", {class: "fly", text: pick(STAR_CHARS)});
    const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 90;
    s.style.left = cx + "px"; s.style.top = cy + "px";
    s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
    s.style.setProperty("--r", (Math.random() * 120 - 60) + "deg");
    document.body.append(s);
    setTimeout(() => s.remove(), 1200);
  }
}

   三、发音：浏览器自带 Web Speech API（speechSynthesis）
   ========================================================= */
const Speech = (() => {
  const supported = typeof window !== "undefined" && "speechSynthesis" in window &&
                    typeof window.SpeechSynthesisUtterance !== "undefined";
  let enVoice = null, altVoice = null, run = 0, rate = 0.8, voiceCount = 0;
  const hold = []; // 防止 Chrome 把正在朗读的 utterance 回收导致 onend 不触发

  function loadVoices() {
    if (!supported) return;
    const voices = window.speechSynthesis.getVoices() || [];
    voiceCount = voices.length;
    const us = voices.filter(v => /^en[-_]US/i.test(v.lang));
    const en = voices.filter(v => /^en/i.test(v.lang));
    const nice = list => list.find(v => /google|samantha|aria|jenny|natural|zira/i.test(v.name)) || list[0] || null;
    enVoice = nice(us) || nice(en);
    const others = (us.length > 1 ? us : en).filter(v => v !== enVoice);
    altVoice = others[0] || enVoice;
  }
  if (supported) {
    loadVoices();
    const ss = window.speechSynthesis;
    if (ss.addEventListener) ss.addEventListener("voiceschanged", loadVoices);
    else ss.onvoiceschanged = loadVoices;
  }

  /** 开始一段新的朗读（会打断之前的），返回本次的编号 */
  function newRun() {
    run++;
    if (supported) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    return run;
  }
  const alive = id => id === run;

  /** 朗读一段英文，读完（或被打断）后 resolve */
  function say(text, opt = {}) {
    return new Promise(resolve => {
      if (!supported) { noSpeechNotice(); resolve(false); return; }
      const ss = window.speechSynthesis;
      const u = new SpeechSynthesisUtterance(String(text).replace(/\s*(\.\.\.|…)\s*/g, " ").trim());
      u.lang = "en-US";
      u.rate = rate;
      u.pitch = opt.pitch || 1;
      const v = opt.voice === "alt" ? altVoice : enVoice;
      if (v) u.voice = v;
      hold.push(u); if (hold.length > 6) hold.shift();
      let finished = false, timer = 0;
      const done = ok => { if (finished) return; finished = true; clearTimeout(timer); resolve(ok); };
      u.onend = () => done(true);
      u.onerror = () => done(false);
      // 个别浏览器 onend 偶尔不触发：按文字长度估算一个兜底时间
      timer = setTimeout(() => done(true), 2500 + text.length * 160 * (0.8 / rate));
      try { if (ss.paused) ss.resume(); ss.speak(u); } catch (e) { done(false); }
    });
  }
  /** 单独点读：先打断正在读的，再读这一个 */
  function speak(text, opt) { newRun(); return say(text, opt); }

  return {
    supported, newRun, alive, say, speak,
    get rate() { return rate; }, set rate(v) { rate = v; },
    hasEnglishVoice: () => !!enVoice, voiceCount: () => voiceCount
  };
})();

function noSpeechNotice() {
  showSpeechTip("😢 你的浏览器暂时不支持朗读功能，所以听不到声音。建议用电脑或手机上较新的 Chrome、Edge 或 Safari 浏览器打开。别担心，卡片和游戏照样可以玩～");
  toast("这个浏览器不会朗读，换个浏览器试试吧～");
}
function showSpeechTip(msg) { const tip = $("#speechTip"); tip.textContent = msg; tip.hidden = false; }

/** 读的时候给元素加高亮 */
async function sayEl(el, text, opt) {
  el.classList.add("speaking");
  try { return await Speech.say(text, opt); }
  finally { el.classList.remove("speaking"); }
}
/** 给孩子留出跟读的时间（按单词数估算） */
function followMs(text) {
  const words = text.split(/\s+/).filter(Boolean).length;
  return Math.max(2200, 1200 + words * 650) * (0.8 / Speech.rate);
}
async function followPause(host, text, id) {
  let box = host.querySelector(":scope > .follow");
  if (!box) { box = h("div", {class: "follow"}); host.append(box); }
  const ms = followMs(text);
  const msg = h("div", {text: "🎤 轮到你啦！大声读一读～"});
  const fill = h("i");
  box.replaceChildren(msg, h("div", {class: "bar"}, fill));
  box.classList.add("show");
  host.classList.add("your-turn");
  fill.style.transition = "none"; fill.style.width = "0%";
  void fill.offsetWidth;
  fill.style.transition = `width ${ms}ms linear`; fill.style.width = "100%";
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { if (!Speech.alive(id)) break; await wait(100); }
  host.classList.remove("your-turn");
  if (Speech.alive(id)) { msg.textContent = pick(PRAISE_SMALL); await wait(900); }
  box.classList.remove("show");
  return Speech.alive(id);
}

const WordsState = {theme: "family", mode: "list", order: [], idx: 0};
function renderWords() {
  chipRow($("#wordThemes"), THEMES, WordsState.theme, id => { WordsState.theme = id; drawWords(); });
  $("#modeList").addEventListener("click", () => { WordsState.mode = "list"; drawWords(); });
  $("#modeCard").addEventListener("click", () => { WordsState.mode = "card"; drawWords(); });
  drawWords();
}
function themeOf(id) { return THEMES.find(t => t.id === id); }
function drawWords() {
  $("#modeList").classList.toggle("on", WordsState.mode === "list");
  $("#modeCard").classList.toggle("on", WordsState.mode === "card");
  const theme = themeOf(WordsState.theme);
  const area = $("#wordArea");

    area.replaceChildren(h("div", {class: "word-grid"}, theme.list.map(w => {
      const tile = h("button", {class: "word", title: "点我听发音"},
        h("span", {class: "emo" + (w.emoji ? "" : " faded"), text: w.emoji || theme.icon}),
        h("span", {class: "w en", text: w.en}),
        h("span", {class: "zh", text: w.zh}));
      tile.addEventListener("click", () => { bump(tile); Speech.speak(w.en); });
      return tile;
    })));
  } else {
    WordsState.order = theme.list.slice();
    WordsState.idx = 0;
    drawCard();
  }
}
function drawCard() {
  const theme = themeOf(WordsState.theme);
  const w = WordsState.order[WordsState.idx];
  const card = h("button", {class: "flip", "aria-label": "单词卡片，点一下翻面"},
    h("div", {class: "flip-inner"},
      h("div", {class: "face front"},
        h("div", {class: "big-word en", text: w.en}),
        h("div", {class: "hint", text: "👆 点一下，看看中文意思"})),
      h("div", {class: "face back"},
        h("div", {class: "big-emo", text: w.emoji || theme.icon}),
        h("div", {class: "big-zh", text: w.zh}),
        h("div", {class: "hint", text: "🔊 再点一下，听听怎么读"}))));
  // 正面 → 点一下翻到中文；背面 → 再点一下朗读，并翻回正面
  card.addEventListener("click", () => {
    if (!card.classList.contains("flipped")) {
      card.classList.add("flipped");
    } else {
      Speech.speak(w.en);
      card.classList.remove("flipped");
    }
  });

  $("#wordArea").replaceChildren(
    card,
    h("div", {class: "row"},
      h("button", {class: "big-btn light", onclick: () => go(-1)}, "⬅️ 上一张"),

      h("button", {class: "big-btn light", onclick: () => go(1)}, "下一张 ➡️")));

/* =========================================================
   六、句子：点读 + 跟读
   ========================================================= */
const SentState = {cat: "all"};
function renderSentences() {
  const cats = [{id: "all", name: "全部", icon: "🌈"}, ...SENT_CATS];
  chipRow($("#sentCats"), cats, SentState.cat, id => { SentState.cat = id; Speech.newRun(); drawSentences(); });
  $("#sentAuto").addEventListener("click", autoFollow);
  $("#sentStop").addEventListener("click", () => Speech.newRun());
  drawSentences();
}
function drawSentences() {
  const list = $("#sentList");
  const groups = SENT_CATS.filter(c => SentState.cat === "all" || c.id === SentState.cat);
  const kids = [];
  for (const c of groups) {
    if (SentState.cat === "all") kids.push(h("div", {class: "cat-title", text: `${c.icon} ${c.name}`}));
    for (const s of SENTENCES.filter(x => x.cat === c.id)) kids.push(sentenceCard(s));
  }
  list.replaceChildren(...kids);
}
function sentenceCard(s) {
  const card = h("div", {class: "sent"});
  const txt = h("div", {class: "txt tap", tabindex: "0", role: "button", title: "点我听"},
    h("span", {class: "en", text: s.en}), h("span", {class: "zh-line", text: s.zh}));
  const listen = async () => { const id = Speech.newRun(); await sayEl(card, s.en); return id; };
  const follow = async () => {
    const id = Speech.newRun();
    await sayEl(card, s.en);
    if (Speech.alive(id)) await followPause(card, s.en, id);
  };
  txt.addEventListener("click", listen);
  txt.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); listen(); } });
  card.append(txt, h("div", {class: "btns"},
    h("button", {class: "icon-btn", title: "听一听", onclick: listen}, "🔊 听"),
    h("button", {class: "icon-btn follow-btn", title: "听完自己读", onclick: follow}, "🎤 跟读")));
  card._sentence = s;
  return card;
}
async function autoFollow() {
  const id = Speech.newRun();
  const cards = $$("#sentList .sent");
  for (const card of cards) {
    if (!Speech.alive(id)) return;
    card.scrollIntoView({behavior: "smooth", block: "center"});
    await sayEl(card, card._sentence.en);
    if (!Speech.alive(id)) return;
    if (!(await followPause(card, card._sentence.en, id))) return;
  }
  if (Speech.alive(id)) toast("🎉 这一组读完啦，想读哪句再点哪句～");
}

/* =========================================================
   七、对话：点一句读一句 + 分角色读
   ========================================================= */
const DlgState = {idx: 0};
const ROLE_VOICE = {A: {pitch: 1.15}, B: {pitch: 0.9, voice: "alt"}};
function renderDialogues() {
  chipRow($("#dlgList"), DIALOGUES.map((d, i) => ({id: String(i), name: d.zh, icon: d.icon})), "0",
    id => { DlgState.idx = Number(id); Speech.newRun(); drawDialogue(); });
  drawDialogue();
}
function drawDialogue() {
  const d = DIALOGUES[DlgState.idx];
  const area = $("#dlgArea");
  const lineEls = d.lines.map(([role, en, zh]) => {
    const r = d.roles[role];
    const bubble = h("div", {class: "bubble"},
      h("span", {class: "who", text: `${role} · ${r.name}`}),
      h("span", {class: "en", text: en}),
      h("span", {class: "zh-line", text: zh}));
    const line = h("div", {class: "line " + role, role: "button", tabindex: "0", title: "点我读这一句"},
      h("div", {class: "avatar"}, r.icon, h("small", {text: role})), bubble);
    const read = () => { Speech.newRun(); sayEl(bubble, en, ROLE_VOICE[role]); };
    line.addEventListener("click", read);
    line.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); read(); } });
    line._data = {role, en, bubble};
    return line;
  });
  async function play(kidRole) {
    const id = Speech.newRun();
    for (const line of lineEls) {
      if (!Speech.alive(id)) return;
      const {role, en, bubble} = line._data;
      line.scrollIntoView({behavior: "smooth", block: "nearest"});
      if (role === kidRole) { if (!(await followPause(bubble, en, id))) return; }
      else { await sayEl(bubble, en, ROLE_VOICE[role]); await wait(250); }
    }
    if (Speech.alive(id)) toast(kidRole ? "🎭 演得真好！换个角色再来一次？" : "👏 听完啦！");
  }
  area.replaceChildren(
    h("div", {class: "dlg-head"},
      h("div", {class: "t en", text: `${d.icon} ${d.title}`}),
      h("div", {class: "zh-line", text: d.zh})),
    h("div", {class: "cast"},
      h("span", {text: `A：${d.roles.A.icon} ${d.roles.A.name}`}),
      h("span", {text: `B：${d.roles.B.icon} ${d.roles.B.name}`})),
    h("div", {class: "row"},
      h("button", {class: "big-btn green", onclick: () => play(null)}, "▶️ 听整段"),
      h("button", {class: "big-btn pink", onclick: () => play("A")}, `🙋 我来演 A（${d.roles.A.name}）`),
      h("button", {class: "big-btn", onclick: () => play("B")}, `🙋 我来演 B（${d.roles.B.name}）`),
      h("button", {class: "big-btn gray", onclick: () => Speech.newRun()}, "⏹ 停")),
    h("div", {class: "bubbles"}, lineEls));
}

/* =========================================================
   八、短文：整篇朗读 + 逐句点读 + 逐句跟读
   ========================================================= */
const PsgState = {idx: 0};
function renderPassages() {
  chipRow($("#psgList"), PASSAGES.map((p, i) => ({id: String(i), name: p.zh, icon: p.icon})), "0",
    id => { PsgState.idx = Number(id); Speech.newRun(); drawPassage(); });
  drawPassage();
}
function drawPassage() {
  const p = PASSAGES[PsgState.idx];
  const enSpans = [], zhSpans = [];
  const para = h("p", {class: "para en"});
  const zhPara = h("p", {class: "zh-para"});
  const followHost = h("div", {class: "p-follow"});
  p.sents.forEach(([en, zh], i) => {
    const s = h("span", {class: "s", role: "button", tabindex: "0", title: "点我听这一句", text: en});
    const z = h("span", {class: "zs", text: zh});
    const read = async () => {
      Speech.newRun();
      z.classList.add("speaking");
      await sayEl(s, en);
      z.classList.remove("speaking");
    };
    s.addEventListener("click", read);
    s.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); read(); } });
    enSpans.push(s); zhSpans.push(z);
    para.append(s, " ");
    zhPara.append(z);
  });
  async function readAll(follow) {
    const id = Speech.newRun();
    for (let i = 0; i < p.sents.length; i++) {
      if (!Speech.alive(id)) break;
      const en = p.sents[i][0];
      zhSpans[i].classList.add("speaking");
      await sayEl(enSpans[i], en);
      if (follow && Speech.alive(id)) {
        enSpans[i].classList.add("speaking");
        await followPause(followHost, en, id);
        enSpans[i].classList.remove("speaking");
      } else if (Speech.alive(id)) await wait(200);
      zhSpans[i].classList.remove("speaking");
    }
    zhSpans.forEach(z => z.classList.remove("speaking"));
    enSpans.forEach(z => z.classList.remove("speaking"));
    if (Speech.alive(id)) toast(follow ? "🌟 你一句一句都读下来了，真棒！" : "📖 整篇读完啦！");
  }
  $("#psgArea").replaceChildren(h("div", {class: "passage"},
    h("p", {class: "p-emo", text: p.icon}),
    h("h2", {class: "p-title en", text: p.title}),
    h("p", {class: "p-zh zh-line", text: p.zh}),
    h("div", {class: "row"},
      h("button", {class: "big-btn green", onclick: () => readAll(false)}, "▶️ 整篇朗读"),
      h("button", {class: "big-btn orange", onclick: () => readAll(true)}, "🎤 一句一句跟读"),
      h("button", {class: "big-btn gray", onclick: () => Speech.newRun()}, "⏹ 停")),
    para, followHost,
    h("div", {class: "cat-title", text: "🀄 中文意思"}), zhPara));
}

/* =========================================================
   九、游戏：听音选词 + 单词配对（不计分、不记错题）
   ========================================================= */
const GameState = {game: "listen", theme: "all"};
function gamePool(theme) {
  const src = theme === "all" ? ALL_WORDS : themeOf(theme).list;
  return uniqueBy(src, w => w.en.toLowerCase());
}
// 配对用：有 emoji，而且 emoji 在全站唯一（同一个图不会对应两个词）
const MATCHABLE = (() => {
  const used = new Set(), out = [];
  for (const w of ALL_WORDS) {
    if (!w.emoji || used.has(w.emoji)) continue;
    used.add(w.emoji); out.push(w);
  }
  return out;
})();
function renderGames() {
  $("#gListen").addEventListener("click", () => { GameState.game = "listen"; drawGame(); });
  $("#gMatch").addEventListener("click", () => { GameState.game = "match"; drawGame(); });
  chipRow($("#gameThemes"), [{id: "all", name: "全部混合", icon: "🌈"}, ...THEMES], GameState.theme,
    id => { GameState.theme = id; drawGame(); });
  drawGame();
}
function drawGame() {
  Speech.newRun();
  $("#gListen").classList.toggle("on", GameState.game === "listen");
  $("#gMatch").classList.toggle("on", GameState.game === "match");
  if (GameState.game === "listen") newListenRound(false); else newMatchRound();
}

/* ---- 听音选词 ---- */
const Listen = {word: null, last: null, solved: false, hint: false};
function buildListenQuestion(theme, lastEn) {
  const pool = gamePool(theme);
  let choices = pool.filter(w => w.en !== lastEn);
  if (!choices.length) choices = pool;
  const word = pick(choices);
  const sameTheme = shuffle(pool.filter(w => w.en.toLowerCase() !== word.en.toLowerCase()));
  const distractors = sameTheme.slice(0, 3);
  if (distractors.length < 3) {
    const extra = shuffle(gamePool("all").filter(w => w.en.toLowerCase() !== word.en.toLowerCase() &&
      !distractors.some(d => d.en.toLowerCase() === w.en.toLowerCase())));
    distractors.push(...extra.slice(0, 3 - distractors.length));
  }
  return {word, options: shuffle([word, ...distractors])};
}
function newListenRound(autoplay) {
  const q = buildListenQuestion(GameState.theme, Listen.last && Listen.last.en);
  Listen.word = q.word; Listen.last = q.word; Listen.solved = false;
  const fb = h("div", {class: "feedback", text: "👆 先点大喇叭听一听，再选出你听到的单词"});
  const speaker = h("button", {class: "speaker", title: "听单词", "aria-label": "听单词"}, "🔊");
  speaker.addEventListener("click", () => Speech.speak(Listen.word.en));
  const opts = q.options.map(w => {
    const b = h("button", {class: "opt en"},
      Listen.hint ? h("span", {class: "oe", text: w.emoji || themeOf(w.theme).icon}) : null, w.en);
    b.addEventListener("click", () => chooseListen(b, w, fb, next));
    return b;
  });
  const next = h("button", {class: "big-btn pink", onclick: () => newListenRound(true)}, "➡️ 再来一个");
  const hintBtn = h("button", {class: "big-btn light", onclick: () => { Listen.hint = !Listen.hint; newListenRound(false); }},
    Listen.hint ? "🙈 不要图片提示" : "🖼️ 给我图片提示");
  $("#gameArea").replaceChildren(speaker, h("div", {class: "options"}, opts), fb,
    h("div", {class: "row"}, hintBtn, next));
  if (autoplay) setTimeout(() => Speech.speak(Listen.word.en), 150);
}
function chooseListen(btn, w, fb, next) {
  if (Listen.solved) { Speech.speak(w.en); return; }
  if (w.en === Listen.word.en) {
    Listen.solved = true;
    btn.classList.add("right");
    burst(btn, 12);
    fb.className = "feedback good";
    fb.textContent = `${pick(PRAISE_BIG)}　${w.emoji || ""} ${w.en} = ${w.zh}`;
    Speech.speak(w.en);
    next.focus({preventScroll: true});
  } else {
    // 答错：温和提示，不扣分、不记录，再听一次
    btn.classList.add("tried");
    bump(btn, "wiggle");
    fb.className = "feedback soft";
    fb.textContent = pick(SOFT_TRY);
    const id = Speech.newRun();
    setTimeout(() => { if (Speech.alive(id)) Speech.say(Listen.word.en); }, 700);
  }
}

/* ---- 单词配对 ---- */
const Match = {sel: null, total: 0, done: 0, swap: false};
function buildMatchRound(theme, n = 6) {
  const pool = MATCHABLE.filter(w => theme === "all" || w.theme === theme);
  return uniqueBy(shuffle(pool), w => w.en.toLowerCase()).slice(0, n);
}
function newMatchRound() {
  const words = buildMatchRound(GameState.theme);
  Match.sel = null; Match.total = words.length; Match.done = 0;
  const mk = (w, side) => {
    const isPic = side === "pic";
    const t = h("button", {class: "tile " + (isPic ? "pic" + (/^\d+$/.test(w.emoji) ? " txt" : "") : "word-t en"),
      "data-key": w.en, "data-side": side, text: isPic ? w.emoji : w.en});
    t.addEventListener("click", () => clickTile(t, w));
    return t;
  };
  const picCol = h("div", {class: "mcol"}, shuffle(words).map(w => mk(w, "pic")));
  const wordCol = h("div", {class: "mcol"}, shuffle(words).map(w => mk(w, "word")));
  const fb = h("div", {class: "feedback", id: "matchFb", text: "👆 先点一个图片，再点它的英文（反过来也行）"});
  $("#gameArea").replaceChildren(
    h("div", {class: "match", id: "matchBoard"}, Match.swap ? [wordCol, picCol] : [picCol, wordCol]),
    fb,
    h("div", {class: "row", id: "matchRow"},
      h("button", {class: "big-btn light", onclick: () => { Match.swap = !Match.swap; newMatchRound(); }}, "🔁 左右换一换"),
      h("button", {class: "big-btn purple", onclick: newMatchRound}, "🔄 换一批")));
}
function clickTile(tile, w) {
  if (tile.classList.contains("matched")) { Speech.speak(w.en); return; }
  if (tile.dataset.side === "word") Speech.speak(w.en);
  const sel = Match.sel;
  if (!sel || sel.dataset.side === tile.dataset.side) {
    if (sel) sel.classList.remove("sel");
    if (sel === tile) { Match.sel = null; return; }
    tile.classList.add("sel"); Match.sel = tile; return;
  }
  sel.classList.remove("sel"); Match.sel = null;
  const fb = $("#matchFb");
  if (sel.dataset.key === tile.dataset.key) {
    [sel, tile].forEach(t => { t.classList.add("matched"); t.setAttribute("aria-disabled", "true"); });
    burst(tile, 8); burst(sel, 6);
    Speech.speak(w.en);
    Match.done++;
    fb.className = "feedback good";
    fb.textContent = `${pick(["✨ 配上啦！", "🎉 对啦！", "👏 真棒！", "🌟 好眼力！"])}　${w.emoji} = ${w.en}（${w.zh}）`;
    if (Match.done === Match.total) {
      setTimeout(() => {
        burst($("#matchBoard"), 20);
        fb.replaceWith(h("div", {class: "celebrate", id: "matchFb"}, "🎉🎉 全部配上啦！你真棒！🎉🎉"));
        $("#matchRow").prepend(h("button", {class: "big-btn pink", onclick: newMatchRound}, "▶️ 再玩一局"));
      }, 600);
    }
  } else {
    [sel, tile].forEach(t => bump(t, "wiggle"));
    fb.className = "feedback soft";
    fb.textContent = pick(["🙂 这两个不是一对哦，再找找看～", "😊 差一点点，再试试别的！", "🔍 再仔细看看～"]);
  }
}

} else {
  // 有的浏览器（比如部分 Linux 上的 Firefox）虽然有接口，但没有任何英文语音
  setTimeout(() => {
    if (!Speech.hasEnglishVoice()) {
      showSpeechTip(Speech.voiceCount() === 0
        ? "🔈 浏览器没有找到可用的语音，可能听不到声音。可以换用 Chrome / Edge / Safari，或在系统设置里添加“英语（美国）”语音。"
        : "🔈 没有找到英文语音，读音可能不太标准。可以在系统设置里添加“英语（美国）”语音包。");
    }
  }, 2500);
}

showTab(location.hash.slice(1) || "words");
