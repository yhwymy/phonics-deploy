<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>儿童英语口语 801-1000 句</title>
<style>
  :root{
    --bg:#FFFBF0;
    --card:#FFFFFF;
    --ink:#3D3A50;
    --muted:#9A96AB;
    --line:#F0E9DC;
    --accent:#FF8A5C;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
  }

  /* ===== Header ===== */
  .hero{
    position:relative;
    text-align:center;
    padding:48px 20px 30px;
    overflow:hidden;
  }
  .hero .deco{ position:absolute; font-size:34px; user-select:none; pointer-events:none; animation:float 5s ease-in-out infinite; }
  .hero h1{
    font-size:clamp(30px,6vw,52px);
    font-weight:900;
    background:linear-gradient(135deg,#FF6B6B 0%,#FF9F43 40%,#54A0FF 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:2px;
  }
  .hero .badge{
    display:inline-block; margin-top:12px;
    background:linear-gradient(135deg,#6BCB77,#54A0FF);
    color:#fff; font-size:13px; font-weight:700;
    padding:5px 16px; border-radius:99px;
  }
  .hero p{
    margin-top:10px;
    color:var(--muted);
    font-size:clamp(14px,2.5vw,18px);
  }
  .rainbow{
    width:min(560px,80vw);
    height:10px;
    margin:22px auto 0;
    border-radius:99px;
    background:linear-gradient(90deg,#FF6B6B,#FF9F43,#FFD93D,#6BCB77,#54A0FF,#A29BFE,#FF6B9D);
    box-shadow:0 4px 12px rgba(255,150,80,.25);
  }
  @keyframes float{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-14px) rotate(6deg); }
  }

  /* ===== Toolbar ===== */
  .toolbar{
    position:sticky; top:0; z-index:50;
    background:rgba(255,251,240,.92);
    backdrop-filter:blur(8px);
    padding:12px 16px 10px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .toolbar-inner{ max-width:1080px; margin:0 auto; }
  .search-row{ display:flex; gap:10px; align-items:center; }
  .search-box{
    flex:1;
    display:flex; align-items:center;
    background:#fff; border:2px solid var(--line); border-radius:99px;
    padding:0 16px; height:44px;
    transition:border-color .2s;
  }
  .search-box:focus-within{ border-color:var(--accent); }
  .search-box span{ font-size:18px; margin-right:8px; }
  .search-box input{
    flex:1; border:none; outline:none; background:transparent;
    font-size:15px; color:var(--ink); font-family:inherit;
  }
  .btn{
    border:none; border-radius:99px; cursor:pointer;
    font-size:14px; font-weight:700; font-family:inherit;
    padding:0 18px; height:44px; white-space:nowrap;
    transition:transform .15s, box-shadow .15s, background .2s;
  }
  .btn:active{ transform:scale(.95); }
  .btn-speak-all{
    background:linear-gradient(135deg,#6BCB77,#54A0FF);
    color:#fff;
    box-shadow:0 4px 12px rgba(84,160,255,.35);
  }
  .btn-speak-all:hover{ box-shadow:0 6px 16px rgba(84,160,255,.45); }
  .btn-stop{ background:#FF6B6B; color:#fff; box-shadow:0 4px 12px rgba(255,107,107,.35); }
  .chips{
    margin-top:10px;
    display:flex; gap:8px; overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:thin;
  }
  .chips::-webkit-scrollbar{ height:5px; }
  .chips::-webkit-scrollbar-thumb{ background:#E6DCC8; border-radius:99px; }
  .chip{
    flex:0 0 auto;
    border:2px solid var(--line); background:#fff;
    border-radius:99px; padding:7px 14px;
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
    color:var(--ink); transition:all .15s;
  }
  .chip:hover{ border-color:var(--accent); color:var(--accent); }
  .chip.active{ border-color:var(--accent); background:var(--accent); color:#fff; }

  /* ===== 语音设置面板 ===== */
  .btn-settings{ background:#fff; border:2px solid var(--line); color:var(--ink); }
  .btn-settings:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-settings.on{ border-color:var(--accent); background:var(--accent); color:#fff; }
  .settings-panel{
    display:none; margin-top:10px;
    background:#fff; border:2px solid var(--line); border-radius:16px;
    padding:6px 16px 12px;
  }
  .settings-panel.open{ display:block; }
  .set-row{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:10px 0;
  }
  .set-row + .set-row{ border-top:1px dashed var(--line); }
  .set-label{ font-size:13px; font-weight:700; color:var(--muted); min-width:64px; }
  .set-label b{ color:var(--accent); font-size:14px; }
  .mode-tabs{ display:flex; gap:8px; }
  .mode-btn{
    border:2px solid var(--line); background:#fff; border-radius:99px;
    padding:6px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
    color:var(--ink); transition:all .15s;
  }
  .mode-btn.active{ border-color:#6BCB77; background:#EAF9EE; color:#2E7D46; }
  .mode-btn.local.active{ border-color:#54A0FF; background:#EAF2FF; color:#2B6CB0; }
  .settings-panel select{
    border:2px solid var(--line); border-radius:10px; padding:7px 10px;
    font-size:13px; font-family:inherit; color:var(--ink); background:#fff;
    outline:none; flex:1; min-width:200px; max-width:360px;
  }
  .settings-panel select:focus{ border-color:var(--accent); }
  .settings-panel input[type=range]{
    flex:1; min-width:140px; max-width:240px; accent-color:var(--accent);
  }
  .try-btn{
    border:none; border-radius:99px; background:linear-gradient(135deg,#6BCB77,#54A0FF);
    color:#fff; padding:8px 18px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .try-btn:active{ transform:scale(.95); }
  .set-hint{ font-size:12px; color:var(--muted); flex-basis:100%; line-height:1.5; }
  .toast{
    position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(20px);
    background:#3D3A50; color:#fff; padding:10px 20px; border-radius:99px;
    font-size:13px; z-index:100; opacity:0; pointer-events:none;
    transition:all .3s; box-shadow:0 6px 20px rgba(0,0,0,.2);
    max-width:90vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ===== Content ===== */
  main{ max-width:1080px; margin:0 auto; padding:18px 16px 40px; }
  .stats{
    font-size:13px; color:var(--muted);
    margin:6px 2px 16px;
  }
  .stats b{ color:var(--accent); }

  .cat{ margin-bottom:34px; scroll-margin-top:120px; }
  .cat-head{
    display:flex; align-items:center; gap:14px;
    margin-bottom:14px;
  }
  .cat-emoji{
    width:52px; height:52px; flex:0 0 52px;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-size:28px;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
  }
  .cat-title{ font-size:20px; font-weight:800; }
  .cat-tags{ margin-top:4px; font-size:15px; letter-spacing:4px; }
  .cat-count{
    margin-left:auto; font-size:12px; font-weight:700;
    color:#fff; padding:4px 10px; border-radius:99px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:10px;
  }
  .s-card{
    display:flex; align-items:center; gap:12px;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:16px;
    padding:12px 14px;
    cursor:pointer;
    transition:transform .15s, box-shadow .2s, border-color .2s;
    position:relative;
    overflow:hidden;
  }
  .s-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:var(--c); opacity:0;
    transition:opacity .2s;
  }
  .s-card:hover{ transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.08); }
  .s-card:hover::before{ opacity:1; }
  .s-card.speaking{
    border-color:var(--c);
    background:color-mix(in srgb, var(--c) 6%, #fff);
  }
  .num{
    flex:0 0 34px; width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color:#fff;
  }
  .txt{ flex:1; min-width:0; }
  .en{
    font-size:17px; font-weight:700; line-height:1.35;
    font-family:"Comic Sans MS","Segoe UI","Microsoft YaHei",sans-serif;
  }
  .zh{ font-size:13.5px; color:var(--muted); margin-top:2px; line-height:1.4; }
  .speak-btn{
    flex:0 0 36px; width:36px; height:36px;
    border:none; border-radius:50%;
    background:#F6F1E6; cursor:pointer;
    font-size:17px; line-height:1;
    transition:all .15s;
    display:flex; align-items:center; justify-content:center;
  }
  .speak-btn:hover{ background:var(--c); }
  .s-card.speaking .speak-btn{ background:var(--c); animation:pulse 1s infinite; }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--c) 45%, transparent); }
    50%{ box-shadow:0 0 0 8px transparent; }
  }
  .s-card.hidden{ display:none; }

  .empty{
    text-align:center; padding:50px 20px; color:var(--muted);
    font-size:16px;
  }
  .empty .big{ font-size:48px; display:block; margin-bottom:10px; }

  /* category flash when jumped */
  .cat.flash .cat-head .cat-emoji{ animation:bounce .8s ease; }
  @keyframes bounce{
    0%,100%{ transform:scale(1); }
    40%{ transform:scale(1.25) rotate(-6deg); }
  }

  footer{
    text-align:center; padding:24px 16px 36px;
    color:var(--muted); font-size:13px;
    border-top:1px solid var(--line);
  }
  footer b{ color:var(--ink); }

  @media (max-width:560px){
    .grid{ grid-template-columns:1fr; }
    .btn-speak-all{ padding:0 14px; font-size:13px; }
    .search-box{ height:42px; }
    .btn{ height:42px; }
  }
</style>
</head>

      </div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main>
  <div class="stats" id="stats"></div>
  <div id="content"></div>
  <div class="empty hidden" id="empty">

<footer>

/* ===== 在线朗读：微软 Edge Neural（接近真人） ===== */
let edgeWs = null, edgeChunks = [], edgeJob = null;
function uuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}
function edgeConnect(){
  return new Promise((resolve, reject)=>{
    if(edgeWs && edgeWs.readyState===WebSocket.OPEN){ resolve(edgeWs); return; }
    if(edgeWs) try{ edgeWs.close(); }catch(e){}
    const ws = new WebSocket(EDGE_WSS+'?TrustedClientToken='+EDGE_TOKEN+'&ConnectionId='+uuid());
    edgeWs = ws;
    ws.binaryType = 'arraybuffer';
    ws.onopen = ()=>{
      ws.send('X-Timestamp:'+new Date().toUTCString()+'\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n'+
        JSON.stringify({context:{synthesis:{audio:{metadataoptions:{sentenceBoundaryEnabled:'false',wordBoundaryEnabled:'false'},outputFormat:'audio-24khz-48kbitrate-mono-mp3'}}}}));
      resolve(ws);
    };
    ws.onerror = ()=>{ reject(new Error('edge-ws-error')); };
    ws.onclose = ()=>{
      edgeWs = null;
      // 连接意外断开且还有未完成任务时立即失败，避免干等 8 秒超时
      const job = edgeJob;
      if(job){ edgeJob = null; clearTimeout(job.timer); job.reject(new Error('edge-ws-closed')); }
    };
    ws.onmessage = (ev)=>{
      if(typeof ev.data === 'string'){
        if(ev.data.indexOf('turn.end')>=0){
          // 按 X-RequestId 匹配当前任务，防止旧请求的结束帧误触发新任务
          const job = edgeJob;
          const rid = (ev.data.match(/X-RequestId:\s*(\S+)/i)||[])[1];
          if(job && rid === job.rid){
            edgeJob = null;
            clearTimeout(job.timer);
            const blob = new Blob(edgeChunks, {type:'audio/mpeg'});
            edgeChunks = [];
            job.resolve(URL.createObjectURL(blob));
          }
        }
        return;
      }
      const buf = new Uint8Array(ev.data);
      if(buf.length < 2) return;
      const hlen = buf[0] | (buf[1]<<8);
      if(buf.length < 2+hlen) return;
      try{
        const h = JSON.parse(new TextDecoder().decode(buf.slice(2, 2+hlen)));
        // 只收集当前任务对应的音频数据，防止并发请求数据串扰
        if(h.type === 'audio' && 2+hlen < buf.length && edgeJob && h.requestId === edgeJob.rid){
          edgeChunks.push(buf.slice(2+hlen));
        }
      }catch(e){}
    };
  });
}
function edgeSpeak(text){
  return new Promise((resolve, reject)=>{
    edgeConnect().then(ws=>{
      if(ws.readyState !== WebSocket.OPEN){ reject(new Error('edge-ws-closed')); return; }
      const rid = uuid();
      edgeChunks = [];
      const job = {resolve, reject, timer:null, rid:rid};
      edgeJob = job;
      job.timer = setTimeout(()=>{          // 8 秒拿不到音频视为失败
        if(edgeJob===job){ edgeJob=null; reject(new Error('edge-timeout')); }
      }, 8000);
      const ssml = "<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'><voice name='"
        + settings.edgeVoice + "'><prosody pitch='+0Hz' rate='" + Math.round((settings.rate-1)*100)
        + "%' volume='+0%'>" + escXml(text) + "</prosody></voice></speak>";
      try{
        ws.send('X-RequestId:'+rid+'\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:'
          + new Date().toUTCString() + '\r\nPath:ssml\r\n\r\n' + ssml);
      }catch(e){ reject(e); }
    }).catch(reject);
  });
}

/* ===== 统一朗读管线（在线 → 本地回退） ===== */
let playToken = 0, edgeAudio = null, allPlaying = false;
function stopSpeak(){
  playToken++;
  allPlaying = false;
  if(edgeJob){ clearTimeout(edgeJob.timer); edgeJob = null; }
  edgeChunks = [];
  if(edgeAudio){ try{ edgeAudio.pause(); }catch(e){} edgeAudio = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.s-card.speaking').forEach(el=>el.classList.remove('speaking'));
  speakAllBtn.textContent = '🔊 全部朗读';
  speakAllBtn.classList.remove('btn-stop');
}
function playText(text, onDone){
  const token = playToken;
  if(settings.mode === 'online'){
    edgeSpeak(text).then(url=>{
      if(token !== playToken){ URL.revokeObjectURL(url); return; }
      edgeAudio = new Audio(url);
      edgeAudio.onended = ()=>{ URL.revokeObjectURL(url); edgeAudio = null; if(token===playToken) onDone(); };
      edgeAudio.onerror = ()=>{ URL.revokeObjectURL(url); edgeAudio = null; localFallback(text, onDone, token); };
      edgeAudio.play().catch(()=>{ URL.revokeObjectURL(url); edgeAudio = null; localFallback(text, onDone, token); });
    }).catch(()=>localFallback(text, onDone, token));
  }else{
    localSpeak(text, onDone, token);
  }
}
function localFallback(text, onDone, token){
  if(token !== playToken) return;
  if(!isIOS) showToast('⚠️ 在线语音连不上，已改用本地语音');
  localSpeak(text, onDone, token);
}
function localSpeak(text, onDone, token){
  if(!('speechSynthesis' in window)){ onDone(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = settings.rate;
  const v = settings.localVoice ? getVoices().find(x=>x.name===settings.localVoice) : null;
  if(v) u.voice = v;
  let done = false;
  const finish = ()=>{
    if(done || token!==playToken) return;
    done = true;
    clearTimeout(u._timer);
    onDone();
  };
  u.onstart = ()=>{ try{ speechSynthesis.resume(); }catch(e){} };   // iOS 必须 resume 才出声
  u.onend = finish;
  u.onerror = finish;
  // iOS 部分系统不触发 onend：按时长估算兜底，防止"全部朗读"卡住
  u._timer = setTimeout(finish, Math.max(2500, text.length * 150 / Math.max(settings.rate, 0.5)));
  speechSynthesis.speak(u);
}

/* ===== 单句 / 全部朗读 ===== */
function speakOne(card){
  stopSpeak();
  card.classList.add('speaking');
  playText(card.dataset.en, ()=>{ card.classList.remove('speaking'); });
}
speakAllBtn.addEventListener('click', ()=>{
  if(allPlaying){ stopSpeak(); return; }
  const visible = cards.filter(c=>!c.el.classList.contains('hidden'));
  if(visible.length===0) return;
  allPlaying = true;
  speakAllBtn.textContent = '⏹ 停止朗读';
  speakAllBtn.classList.add('btn-stop');
  let i = 0;
  function next(){
    if(!allPlaying) return;
    if(i >= visible.length){ stopSpeak(); return; }
    const c = visible[i];
    c.el.classList.add('speaking');
    playText(c.en, ()=>{ c.el.classList.remove('speaking'); i++; next(); });
  }
  next();
});

/* ===== Toast 提示 ===== */
let toastTimer = null;
function showToast(msg){
  let t = document.querySelector('.toast');
  if(!t){ t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3500);
}
</script>
